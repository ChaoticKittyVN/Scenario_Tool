engine:
  engine_type: renpy
paths:
  input_dir: input
  log_dir: logs
  output_dir: output
  param_config_dir: param_config
  input_voice_dir: input/voice
processing:
  batch_size: 100
  enable_progress_bar: true
  ignore_mode: false
  # 开启后，update_param 会按下方 projects 配置加载篇章专用参数文件。
  multi_project_mode: false
  ignore_words:
  - 忽略
  - ''
# 项目键 chapter_a 对应 param_config/param_data_chapter_a.xlsx；
# 识别文本用于匹配演出表文件名，例如：chapter_a: 第一篇
projects: {}
resources:
  extensions:
    图片:
    - .png
    - .jpg
    - .jpeg
    - .webp
    视频:
    - .mp4
    - .webm
    - .ogv
    音频:
    - .ogg
    - .mp3
    - .wav
    - .m4a
  project_root: project
  source_root: resource_library

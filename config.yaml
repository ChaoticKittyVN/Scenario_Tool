engine:
  engine_type: renpy
# 空列表表示启用 engines 目录中实际存在的全部引擎；也可只填写当前项目需要的引擎。
engines:
  enabled: []
paths:
  input_dir: input
  log_dir: logs
  output_dir: output
  param_config_dir: param_config
  input_voice_dir: input/voice
processing:
  batch_size: 100
  enable_progress_bar: true
  ignore_mode: false
  # 开启后，update_param 会按下方 projects 配置加载篇章专用参数文件。
  multi_project_mode: false
  ignore_words:
  - 忽略
  - ''
# 单项目模式配置一个项目时，优先读取 param_data_<引擎>_<项目>.xlsx，
# 其次兼容 param_data_<项目>.xlsx；多项目模式使用后者并按识别文本匹配演出表文件名。
# 例如 chapter_a: 第一篇
projects: {}
# Agent 差分文档保留 variant_data 的所有自定义列，并建立情绪和适用情绪索引。
# enabled 只控制完整 update_param 流程是否附带导出；CLI 和 GUI 可单独执行。
variant_agent_export:
  enabled: false
  # 相对路径以 param_config_dir 为基准。
  output_file: variant_agent_data.json
  group_columns:
  - 情绪
  item_key_column: 序号
  alias_columns:
  - 适用情绪
  parameter_template: '{情绪}{序号}'
  # 可用 '*' 设置所有工作表，也可按工作表名称覆盖以上字段。
  sheet_profiles: {}
resources:
  extensions:
    图片:
    - .png
    - .jpg
    - .jpeg
    - .webp
    视频:
    - .mp4
    - .webm
    - .ogv
    音频:
    - .ogg
    - .mp3
    - .wav
    - .m4a
  project_root: project
  source_root: resource_library
  validate_source: true
  filename_normalization: {}
